[package]
name = "ps-app"
description = "The Plant-Sim desktop app: two-pot mode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "plant-sim"
path = "src/main.rs"

[dependencies]
ps-units.workspace = true
ps-graph.workspace = true
ps-weather.workspace = true
ps-light.workspace = true
ps-mesh.workspace = true
ps-view.workspace = true
ps-ui.workspace = true
ps-arch.workspace = true
ps-world.workspace = true
ps-export.workspace = true
ps-session.workspace = true
bevy.workspace = true
anyhow.workspace = true
mimalloc.workspace = true

[features]
# Links the DXC shader compiler statically (Windows). Without DXC, DX12 compiles shaders
# with the old FXC compiler and the first frame took ~180 s on the owner's GTX 1070.
# Opt-in: it needs the Visual Studio "C++ ATL" component (atls.lib), which a default
# Build Tools install lacks. The CI release artifact enables it.
static-dxc = ["bevy/statically-linked-dxc"]

[dev-dependencies]

[lints]
workspace = true
