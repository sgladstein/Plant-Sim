[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sgladstein/Plant-Sim"
publish = false

[workspace.dependencies]
ps-units = { path = "crates/ps-units" }
ps-rng = { path = "crates/ps-rng" }
ps-weather = { path = "crates/ps-weather" }
ps-graph = { path = "crates/ps-graph" }
ps-species = { path = "crates/ps-species" }
ps-soil = { path = "crates/ps-soil" }
ps-light = { path = "crates/ps-light" }
ps-physio = { path = "crates/ps-physio" }
ps-arch = { path = "crates/ps-arch" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
libm = "0.2"
proptest = "1"
ron = "0.10"
rayon = "1"
ps-mesh = { path = "crates/ps-mesh" }
glam = "0.33"
ps-view = { path = "crates/ps-view" }
ps-ui = { path = "crates/ps-ui" }
# Render crates only (ps-view, ps-ui, ps-app); see docs/bevy-notes.md before changing.
bevy = { version = "=0.20.1", default-features = false, features = ["3d", "ui"] }
bevy_egui = { version = "=0.43.1", default-features = false, features = ["render", "default_fonts"] }
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
# The sim uses short physics names (a, gs, ci) on purpose; they match the model cards.
similar_names = "allow"
many_single_char_names = "allow"

[profile.release]
debug = 1
