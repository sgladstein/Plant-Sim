name: linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Sim jobs never compile Bevy (design plan §11.7); render.yml covers ps-view, ps-ui, ps-app.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (pedantic as errors)
        run: cargo clippy --workspace --exclude ps-view --exclude ps-ui --exclude ps-app --all-targets --locked -- -D warnings
      - name: tests
        run: cargo nextest run --workspace --exclude ps-view --exclude ps-ui --exclude ps-app --locked --no-tests=warn
      - name: doc tests
        run: cargo test --workspace --exclude ps-view --exclude ps-ui --exclude ps-app --doc --locked
      - name: golden hashes
        run: cargo run --locked -p ps-cli -- hash data/scenarios/single_pot.ron data/scenarios/two_pot_sun_shade.ron data/scenarios/single_pot_simplified.ron data/scenarios/fidelity_switch.ron --check-golden tests/golden
      - name: golden hashes, 30-plant plot (30 days)
        run: cargo run --locked -p ps-cli -- hash data/scenarios/plot_30_beans.ron --days 30 --check-golden tests/golden
      - name: dependency rules
        run: python3 scripts/check_deps.py
      - name: determinism lint
        run: python3 scripts/check_determinism.py


  # Sim speed per sim-day for the committed scenarios, printed into the job summary
  # (docs/performance.md). Report only: shared runners are too noisy to gate on wall
  # time, so neither a slow run nor a failure here can fail the build.
  bench-summary:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: sim speed (report only)
        continue-on-error: true
        run: |
          cargo build --release --locked -q -p ps-bench --example sim_days --example breed_generation
          {
            echo "## Sim speed (report only, shared runner)"
            echo
            target/release/examples/sim_days 3
            echo
            echo "## Breeding bench: one ten-seed generation (WP30, report only)"
            echo
            target/release/examples/breed_generation 3
          } >> "$GITHUB_STEP_SUMMARY"

  # WP11: the validation report (design plan §8). Fails on a missed M0 target that is
  # not in validation/known_misses.ron; the plots are uploaded either way.
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the plot dependencies
        run: pip install -r validation/requirements.txt
      - name: validate
        run: cargo run --release --locked -p ps-cli -- validate
      - name: plot report
        if: always()
        run: python3 validation/report.py out/validation
      - name: summary
        if: always()
        run: cat out/validation/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: |
            out/validation/*.md
            out/validation/*.html
            out/validation/*.png
            out/validation/*.csv
            out/validation/curves/
            out/validation/runs/*/daily.csv

  # R3c (decision 0045): the detailed and simplified water network agree on six
  # scenarios and a switch run (fidelity-levels.md §5.1), and every validation gate
  # passes with every plant simplified.
  fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: fidelity report
        run: cargo run --release --locked -p ps-cli -- fidelity
      - name: validate at the simplified level
        run: cargo run --release --locked -p ps-cli -- validate --fidelity simplified --out out/validation-simplified
      - name: summary
        if: always()
        run: |
          cat out/fidelity/report.md >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          head -3 out/validation-simplified/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fidelity-report
          path: |
            out/fidelity/report.md
            out/validation-simplified/report.md
            out/validation-simplified/results.csv

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
