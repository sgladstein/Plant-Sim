name: linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Sim jobs never compile Bevy (design plan §11.7); render.yml covers ps-view, ps-ui, ps-app.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (pedantic as errors)
        run: cargo clippy --workspace --exclude ps-view --exclude ps-ui --exclude ps-app --all-targets --locked -- -D warnings
      - name: tests
        run: cargo nextest run --workspace --exclude ps-view --exclude ps-ui --exclude ps-app --locked --no-tests=warn
      - name: doc tests
        run: cargo test --workspace --exclude ps-view --exclude ps-ui --exclude ps-app --doc --locked
      - name: golden hashes
        run: cargo run --locked -p ps-cli -- hash data/scenarios/single_pot.ron data/scenarios/two_pot_sun_shade.ron --check-golden tests/golden
      - name: dependency rules
        run: python3 scripts/check_deps.py
      - name: determinism lint
        run: python3 scripts/check_determinism.py


  # WP11: the validation report (design plan §8). Fails on a missed M0 target that is
  # not in validation/known_misses.ron; the plots are uploaded either way.
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the plot dependencies
        run: pip install -r validation/requirements.txt
      - name: validate
        run: cargo run --release --locked -p ps-cli -- validate
      - name: plot report
        if: always()
        run: python3 validation/report.py out/validation
      - name: summary
        if: always()
        run: cat out/validation/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: |
            out/validation/*.md
            out/validation/*.html
            out/validation/*.png
            out/validation/*.csv
            out/validation/curves/
            out/validation/runs/*/daily.csv

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Proves the committed gas-exchange fixture (generated without R by
  # validation/fixtures/photosyn_reference.py) against plantecophys itself.
  plantecophys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: install plantecophys
        run: Rscript -e 'install.packages("plantecophys")'
      - name: run plantecophys on the test grid
        run: Rscript validation/fixtures/photosyn_plantecophys.R "$RUNNER_TEMP/photosyn_r.csv"
      - name: compare with the committed fixture
        run: python3 validation/fixtures/compare_photosyn.py crates/ps-physio/tests/fixtures/photosyn.csv "$RUNNER_TEMP/photosyn_r.csv"
