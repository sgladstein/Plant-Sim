name: windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Sim jobs never compile Bevy (design plan §11.7); render.yml covers ps-view, ps-ui, ps-app.
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: build
        run: cargo build --workspace --exclude ps-view --exclude ps-ui --exclude ps-app --all-targets --locked
      - name: sim tests
        run: cargo nextest run --workspace --exclude ps-view --exclude ps-ui --exclude ps-app --locked --no-tests=warn
      - name: golden hashes
        run: cargo run --locked -p ps-cli -- hash data/scenarios/single_pot.ron data/scenarios/two_pot_sun_shade.ron data/scenarios/single_pot_simplified.ron data/scenarios/fidelity_switch.ron --check-golden tests/golden
      - name: golden hashes, 30-plant plot (30 days)
        run: cargo run --locked -p ps-cli -- hash data/scenarios/plot_30_beans.ron --days 30 --check-golden tests/golden
